{% extends "base.html" %}
{% block content %}
<article class="prose mx-auto">
  <p class="bj-eyebrow"><a href="{{ get_url(path='news') }}/" style="text-decoration:none;">← News</a></p>
  <p class="text-sm" style="color: var(--bj-muted);">{{ page.date | date(format="%B %-d, %Y") }}</p>
  <h1>{{ page.title }}</h1>
  {{ page.content | safe }}
</article>
{% endblock %}
