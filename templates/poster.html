{#- One recruiting poster (content/posters/<year>-<audience>/index.md). -#}
{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="prose max-w-none">
    <p class="bj-eyebrow">{{ page.extra.academic_year }} · {{ page.extra.audience }}</p>
    <h1>{{ page.title }}</h1>
    {{ page.content | safe }}
  </div>
  <a class="bj-btn mt-4" href="{{ get_url(path=page.colocated_path ~ page.extra.pdf) }}">Download PDF</a>
  <img class="bj-card w-full h-auto mt-6" src="{{ get_url(path=page.colocated_path ~ page.extra.image) }}" alt="{{ page.title }}, {{ page.extra.academic_year }}">
</div>
{% endblock %}
